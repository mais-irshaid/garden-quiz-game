<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة في بستان الأنظمة</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>🌳 رحلة في بستان الأنظمة 🌳</h1>
  <p class="subtitle">ساعدي البنت تعبر الحديقة بالإجابة عن الأسئلة الصحيحة!</p>

  <!-- شريط التقدم: يبين كم عائق اجتازت وسلة الزهور اللي جمعتها -->
  <div class="progress-panel">
    <div class="progress-text">العوائق: <span id="obstacleCount">0</span> من <span id="totalObstacles">10</span></div>
    <div id="flowerBasket" class="flower-basket"></div>
  </div>

  <!-- المشهد الرئيسي: الحديقة والبنت والصخرة وفقاعة السؤال -->
  <div class="scene">
    <div class="sun">☀️</div>
    <div class="clouds">☁️</div>

    <!-- زينة الحديقة: شجر وورد بالخلفية -->
    <div class="garden-decor">
      <span class="tree" style="left:2%;">🌳</span>
      <span class="tree" style="left:16%;">🌲</span>
      <span class="tree" style="left:37%;">🌳</span>
      <span class="tree" style="left:58%;">🌲</span>
      <span class="tree" style="left:73%;">🌳</span>
      <span class="tree" style="left:88%;">🌲</span>
      <span class="flower-deco" style="left:8%;">🌷</span>
      <span class="flower-deco" style="left:22%;">🌼</span>
      <span class="flower-deco" style="left:33%;">🌸</span>
      <span class="flower-deco" style="left:48%;">🌷</span>
      <span class="flower-deco" style="left:63%;">🌼</span>
      <span class="flower-deco" style="left:77%;">🌸</span>
      <span class="flower-deco" style="left:96%;">🌷</span>
    </div>

    <!-- فقاعة السؤال تظهر فوق راس البنت -->
    <div id="questionBubble" class="question-bubble hidden">
      <div id="questionText" class="question-text"></div>
      <div id="optionsContainer" class="options-container"></div>
      <div id="attemptsIndicator" class="attempts-indicator"></div>
    </div>

    <div class="ground">
      <div class="finish-flag">🏁</div>
      <div id="girl" class="girl"><img class="girl-icon" src="assets/girl.svg" alt="البنت"></div>
      <div id="rock" class="rock"></div>
    </div>
  </div>

  <button id="startBtn" class="action-btn">ابدأي اللعبة</button>

  <!-- شاشة الفوز -->
  <div id="winOverlay" class="overlay hidden">
    <div class="overlay-box">
      <h2>🎉 مبروك! لقد فزت! 🎉</h2>
      <p>لقد جمعتي 10 وردات وعبرتي كل العوائق!</p>
      <button id="playAgainWinBtn" class="action-btn">العب مرة أخرى</button>
    </div>
  </div>

  <!-- شاشة الخسارة -->
  <div id="loseOverlay" class="overlay hidden">
    <div class="overlay-box">
      <h2>😔 حاولي مرة أخرى!</h2>
      <p>استخدمتي كل المحاولات الثلاث. اللعبة رح تبدأ من جديد.</p>
      <button id="playAgainLoseBtn" class="action-btn">ابدأي من جديد</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
