<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <style>
    .ribbon-left {
      transform-origin: 42px 86px;
      animation: ribbonFlutter 1.4s ease-in-out infinite;
    }
    .ribbon-right {
      transform-origin: 158px 86px;
      animation: ribbonFlutter 1.4s ease-in-out infinite;
      animation-delay: 0.35s;
    }
    @keyframes ribbonFlutter {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
  </style>
  <!-- شنطة الظهر -->
  <rect x="122" y="138" width="50" height="66" rx="16" fill="#ff8fab" stroke="#e0577f" stroke-width="3"/>
  <rect x="132" y="156" width="28" height="22" rx="8" fill="#ffb3cf" stroke="#e0577f" stroke-width="2"/>

  <!-- الأرجل والجوارب والأحذية -->
  <rect x="78" y="205" width="16" height="38" rx="6" fill="#e8a978"/>
  <rect x="104" y="205" width="16" height="38" rx="6" fill="#e8a978"/>
  <rect x="78" y="228" width="16" height="16" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <rect x="104" y="228" width="16" height="16" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <rect x="73" y="241" width="26" height="13" rx="6" fill="#3a2a1a"/>
  <rect x="99" y="241" width="26" height="13" rx="6" fill="#3a2a1a"/>

  <!-- التنورة -->
  <path d="M70,165 L128,165 L140,206 L58,206 Z" fill="#1c2340"/>
  <path d="M83,170 L78,202" stroke="#333a66" stroke-width="2" fill="none"/>
  <path d="M99,168 L97,204" stroke="#333a66" stroke-width="2" fill="none"/>
  <path d="M115,170 L120,202" stroke="#333a66" stroke-width="2" fill="none"/>

  <!-- الذراعين -->
  <rect x="58" y="140" width="16" height="46" rx="8" fill="#e8a978"/>
  <rect x="126" y="140" width="16" height="44" rx="8" fill="#e8a978" transform="rotate(12 134 150)"/>

  <!-- القميص والكرافة -->
  <rect x="68" y="128" width="62" height="42" rx="14" fill="#ffffff" stroke="#e6e6e6" stroke-width="2"/>
  <path d="M96,130 L104,130 L102,148 L98,148 Z" fill="#1c2340"/>
  <circle cx="100" cy="132" r="4" fill="#f4c04d"/>

  <!-- الرقبة -->
  <rect x="92" y="116" width="16" height="16" fill="#e8a978"/>

  <!-- الشعر الخلفي -->
  <ellipse cx="100" cy="80" rx="50" ry="48" fill="#2b1b12"/>

  <!-- الرأس -->
  <circle cx="100" cy="90" r="42" fill="#f0b686"/>

  <!-- ضفائر مجعدة يمين ويسار -->
  <g fill="#2b1b12">
    <circle cx="35" cy="95" r="14"/>
    <circle cx="50" cy="88" r="13"/>
    <circle cx="45" cy="110" r="14"/>
    <circle cx="30" cy="110" r="12"/>
    <circle cx="55" cy="104" r="12"/>
  </g>
  <g fill="#2b1b12">
    <circle cx="165" cy="95" r="14"/>
    <circle cx="150" cy="88" r="13"/>
    <circle cx="155" cy="110" r="14"/>
    <circle cx="170" cy="110" r="12"/>
    <circle cx="145" cy="104" r="12"/>
  </g>

  <!-- خصل الشعر الأمامية -->
  <path d="M60,72 Q78,50 100,50 Q122,50 140,72 Q125,62 112,66 Q100,60 88,66 Q75,62 60,72 Z" fill="#2b1b12"/>

  <!-- الفيونكات -->
  <g class="ribbon-left">
    <path d="M26,76 L42,86 L26,96 Z" fill="#ff8fab"/>
    <path d="M58,76 L42,86 L58,96 Z" fill="#ff8fab"/>
    <circle cx="42" cy="86" r="5" fill="#e0577f"/>
  </g>
  <g class="ribbon-right">
    <path d="M142,76 L158,86 L142,96 Z" fill="#ff8fab"/>
    <path d="M174,76 L158,86 L174,96 Z" fill="#ff8fab"/>
    <circle cx="158" cy="86" r="5" fill="#e0577f"/>
  </g>

  <!-- الوجه -->
  <circle cx="68" cy="100" r="8" fill="#ff9eb5" opacity="0.5"/>
  <circle cx="132" cy="100" r="8" fill="#ff9eb5" opacity="0.5"/>

  <path d="M76,72 Q84,67 92,72" stroke="#2b1b12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M108,72 Q116,67 124,72" stroke="#2b1b12" stroke-width="3" fill="none" stroke-linecap="round"/>

  <ellipse cx="84" cy="90" rx="12" ry="14" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <ellipse cx="116" cy="90" rx="12" ry="14" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="84" cy="92" r="8" fill="#2b1b12"/>
  <circle cx="116" cy="92" r="8" fill="#2b1b12"/>
  <circle cx="87" cy="88" r="2.5" fill="#ffffff"/>
  <circle cx="119" cy="88" r="2.5" fill="#ffffff"/>

  <path d="M98,97 Q100,101 102,97" stroke="#c98a5e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M88,109 Q100,119 112,109" stroke="#8a4b3b" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
